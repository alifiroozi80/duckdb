name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-latest
    container:
      image: debian:13-slim

    steps:
    - name: Install build dependencies
      run: apt-get update && apt-get install -y --no-install-recommends build-essential ca-certificates git && rm -rf /var/lib/apt/lists/*

    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.x'
        cache-dependency-path: go.sum

    - name: Verify module graph
      run: go mod verify && go mod tidy -diff

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build ./...

    - name: Test
      run: go test -race -count=1 -v ./...

  macos:
    runs-on: macos-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.x'
        cache-dependency-path: go.sum

    - name: Build
      run: go build ./...

    - name: Test
      run: go test -race -count=1 -v ./...

  windows:
    runs-on: windows-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.x'
        cache-dependency-path: go.sum

    - name: Set up UCRT64 GCC
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: mingw-w64-ucrt-x86_64-gcc
        path-type: inherit

    - name: Build
      shell: msys2 {0}
      env:
        CGO_ENABLED: 1
        CC: gcc
        CXX: g++
      run: go build ./...

    - name: Test
      shell: msys2 {0}
      env:
        CGO_ENABLED: 1
        CC: gcc
        CXX: g++
      run: go test -race -count=1 -v ./...
